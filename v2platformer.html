<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Arcade Platformer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', monospace;
            background-color: #05050a;
            user-select: none;
            -webkit-user-select: none;
        }

        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .arcade-btn {
            background: linear-gradient(to bottom, #3b82f6, #1d4ed8);
            box-shadow: 0 4px 0 #1e3a8a, 0 6px 10px rgba(0, 0, 0, 0.4);
            transition: all 0.05s ease;
        }

        .arcade-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #1e3a8a, 0 3px 5px rgba(0, 0, 0, 0.4);
        }

        .arcade-btn-jump {
            background: linear-gradient(to bottom, #ec4899, #be185d);
            box-shadow: 0 4px 0 #831843, 0 6px 10px rgba(0, 0, 0, 0.4);
        }

        .arcade-btn-jump:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #831843, 0 3px 5px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>

<body class="flex flex-col items-center justify-center min-h-screen text-white overflow-hidden p-2 sm:p-4">

    <div id="game-container"
        class="relative w-full max-w-3xl bg-slate-950 border-4 border-blue-500 rounded-xl shadow-2xl overflow-hidden flex flex-col">

        <!-- Header HUD -->
        <div class="flex justify-between items-center bg-slate-900 px-3 sm:px-4 py-2.5 border-b-2 border-blue-600 text-xs sm:text-sm z-10">
            <div class="flex items-center gap-2 sm:gap-4">
                <div class="flex items-center gap-1 sm:gap-2">
                    <span class="text-yellow-400 font-bold">SCORE:</span>
                    <span id="scoreVal" class="text-white">0</span>
                </div>
                <div class="flex items-center gap-1 sm:gap-2">
                    <span class="text-pink-500 font-bold">LEVEL:</span>
                    <span id="levelVal" class="text-white">1</span>
                </div>
            </div>
            <div class="flex items-center gap-2 sm:gap-4">
                <div class="flex items-center gap-1">
                    <span class="text-red-500 font-bold hidden sm:inline">LIVES:</span>
                    <div id="livesContainer" class="flex gap-0.5 sm:gap-1 text-red-500">❤️❤️❤️</div>
                </div>
                <button id="btnPause" type="button" onclick="togglePause()"
                    class="arcade-btn bg-slate-800 border border-blue-400 text-blue-300 hover:text-white px-2.5 py-1 rounded text-[10px] sm:text-xs font-bold tracking-wider cursor-pointer">
                    ⏸️ MENU
                </button>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div class="relative w-full aspect-[16/10] bg-slate-900 overflow-hidden flex items-center justify-center">
            <canvas id="gameCanvas" class="w-full h-full block bg-slate-950"></canvas>

            <!-- Main Start Menu Overlay -->
            <div id="menuOverlay"
                class="absolute inset-0 bg-slate-950/95 flex flex-col items-center justify-center p-4 sm:p-6 text-center z-20">
                <h1 class="text-2xl sm:text-4xl text-blue-400 mb-2 tracking-wider drop-shadow-[0_4px_rgba(30,58,138,1)] font-extrabold">
                    CYBER JUMPER
                </h1>
                <p class="text-[11px] sm:text-xs text-gray-300 mb-5 leading-5 max-w-md">
                    Collect coins, avoid spikes & ground bots!<br>
                    Defeat flying drones, <span class="text-purple-400 font-bold">Omega Sentinel</span> & <span class="text-orange-400 font-bold">Ignis Prime</span>!<br>
                    <span class="text-yellow-300 font-bold">W / UP / SPACE</span> to Jump & Double Jump
                </p>
                <div class="flex flex-col sm:flex-row gap-3 w-full max-w-md justify-center">
                    <button id="btnStartGame" type="button" onclick="startGame()"
                        class="arcade-btn text-white text-xs sm:text-sm px-6 py-3.5 rounded-lg font-bold tracking-widest cursor-pointer uppercase flex-1">
                        START GAME
                    </button>
                    <button id="btnOpenLevelSelect" type="button" onclick="openLevelSelect()"
                        class="arcade-btn bg-purple-600 text-white text-xs sm:text-sm px-6 py-3.5 rounded-lg font-bold tracking-widest cursor-pointer uppercase flex-1">
                        SELECT LEVEL
                    </button>
                </div>
            </div>

            <!-- Level Selector Overlay -->
            <div id="levelSelectOverlay"
                class="absolute inset-0 bg-slate-950/95 flex flex-col items-center justify-between p-3 sm:p-5 text-center z-20 hidden overflow-y-auto">
                <div class="w-full flex flex-col items-center">
                    <h2 class="text-base sm:text-xl text-purple-400 mb-0.5 tracking-wider drop-shadow-[0_3px_rgba(107,33,168,1)] font-bold">
                        SELECT LEVEL
                    </h2>
                    <p class="text-[10px] sm:text-xs text-gray-400 mb-2">Choose any zone to deploy directly into action</p>

                    <!-- Filter Tabs -->
                    <div class="flex gap-2 mb-2 text-[10px] sm:text-xs">
                        <button id="tabBtnAll" type="button" onclick="filterLevelGrid('all')"
                            class="arcade-btn bg-purple-600 text-white px-2.5 py-1 rounded font-bold uppercase cursor-pointer">
                            ALL ZONES (1-12)
                        </button>
                        <button id="tabBtnCyber" type="button" onclick="filterLevelGrid('cyber')"
                            class="arcade-btn bg-slate-800 border border-purple-500 text-gray-300 px-2.5 py-1 rounded font-bold uppercase cursor-pointer">
                            CYBER (1-6)
                        </button>
                        <button id="tabBtnVolcanic" type="button" onclick="filterLevelGrid('volcanic')"
                            class="arcade-btn bg-slate-800 border border-purple-500 text-gray-300 px-2.5 py-1 rounded font-bold uppercase cursor-pointer">
                            VOLCANIC (7-12)
                        </button>
                    </div>

                    <!-- Seamless Grid (Zones 1-12) -->
                    <div id="lvlGridContainer" class="grid grid-cols-3 sm:grid-cols-4 gap-1.5 sm:gap-2 w-full max-w-2xl">
                        <button id="btnLevel1" type="button" onclick="selectAndStartLevel(1)" data-category="cyber"
                            class="arcade-btn bg-slate-900 border-2 border-blue-500 hover:border-yellow-400 p-2 rounded-lg text-left transition flex flex-col justify-between h-14 cursor-pointer">
                            <span class="text-[10px] sm:text-xs text-yellow-400 font-bold">ZONE 1</span>
                            <span class="text-[9px] sm:text-[10px] text-gray-200 truncate">Neon Roads</span>
                        </button>
                        <button id="btnLevel2" type="button" onclick="selectAndStartLevel(2)" data-category="cyber"
                            class="arcade-btn bg-slate-900 border-2 border-blue-500 hover:border-yellow-400 p-2 rounded-lg text-left transition flex flex-col justify-between h-14 cursor-pointer">
                            <span class="text-[10px] sm:text-xs text-yellow-400 font-bold">ZONE 2</span>
                            <span class="text-[9px] sm:text-[10px] text-gray-200 truncate">Skyway Towers</span>
                        </button>
                        <button id="btnLevel3" type="button" onclick="selectAndStartLevel(3)" data-category="cyber"
                            class="arcade-btn bg-slate-900 border-2 border-pink-500 hover:border-yellow-400 p-2 rounded-lg text-left transition flex flex-col justify-between h-14 cursor-pointer">
                            <span class="text-[10px] sm:text-xs text-pink-400 font-bold">ZONE 3</span>
                            <span class="text-[9px] sm:text-[10px] text-gray-200 truncate">Void Pitfalls</span>
                        </button>
                        <button id="btnLevel4" type="button" onclick="selectAndStartLevel(4)" data-category="cyber"
                            class="arcade-btn bg-slate-900 border-2 border-purple-500 hover:border-yellow-400 p-2 rounded-lg text-left transition flex flex-col justify-between h-14 cursor-pointer">
                            <span class="text-[10px] sm:text-xs text-purple-400 font-bold">ZONE 4</span>
                            <span class="text-[9px] sm:text-[10px] text-gray-200 truncate">Metropolis Core</span>
                        </button>
                        <button id="btnLevel5" type="button" onclick="selectAndStartLevel(5)" data-category="cyber"
                            class="arcade-btn bg-slate-900 border-2 border-red-500 hover:border-yellow-400 p-2 rounded-lg text-left transition flex flex-col justify-between h-14 cursor-pointer">
                            <span class="text-[10px] sm:text-xs text-red-400 font-bold">ZONE 5 👑</span>
                            <span class="text-[9px] sm:text-[10px] text-gray-200 truncate">Omega Boss</span>
                        </button>
                        <button id="btnLevel6" type="button" onclick="selectAndStartLevel(6)" data-category="cyber"
                            class="arcade-btn bg-slate-900 border-2 border-emerald-500 hover:border-yellow-400 p-2 rounded-lg text-left transition flex flex-col justify-between h-14 cursor-pointer">
                            <span class="text-[10px] sm:text-xs text-emerald-400 font-bold">ZONE 6</span>
                            <span class="text-[9px] sm:text-[10px] text-gray-200 truncate">Sanctuary</span>
                        </button>

                        <button id="btnLevel7" type="button" onclick="selectAndStartLevel(7)" data-category="volcanic"
                            class="arcade-btn bg-slate-900 border-2 border-orange-500 hover:border-yellow-400 p-2 rounded-lg text-left transition flex flex-col justify-between h-14 cursor-pointer">
                            <span class="text-[10px] sm:text-xs text-orange-400 font-bold">ZONE 7</span>
                            <span class="text-[9px] sm:text-[10px] text-gray-200 truncate">Volcano Cave</span>
                        </button>
                        <button id="btnLevel8" type="button" onclick="selectAndStartLevel(8)" data-category="volcanic"
                            class="arcade-btn bg-slate-900 border-2 border-orange-500 hover:border-yellow-400 p-2 rounded-lg text-left transition flex flex-col justify-between h-14 cursor-pointer">
                            <span class="text-[10px] sm:text-xs text-orange-400 font-bold">ZONE 8</span>
                            <span class="text-[9px] sm:text-[10px] text-gray-200 truncate">Catwalks</span>
                        </button>
                        <button id="btnLevel9" type="button" onclick="selectAndStartLevel(9)" data-category="volcanic"
                            class="arcade-btn bg-slate-900 border-2 border-amber-500 hover:border-yellow-400 p-2 rounded-lg text-left transition flex flex-col justify-between h-14 cursor-pointer">
                            <span class="text-[10px] sm:text-xs text-amber-400 font-bold">ZONE 9</span>
                            <span class="text-[9px] sm:text-[10px] text-gray-200 truncate">Obsidian Spire</span>
                        </button>
                        <button id="btnLevel10" type="button" onclick="selectAndStartLevel(10)" data-category="volcanic"
                            class="arcade-btn bg-slate-900 border-2 border-red-500 hover:border-yellow-400 p-2 rounded-lg text-left transition flex flex-col justify-between h-14 cursor-pointer">
                            <span class="text-[10px] sm:text-xs text-red-400 font-bold">ZONE 10</span>
                            <span class="text-[9px] sm:text-[10px] text-gray-200 truncate">Foundry</span>
                        </button>
                        <button id="btnLevel11" type="button" onclick="selectAndStartLevel(11)" data-category="volcanic"
                            class="arcade-btn bg-slate-900 border-2 border-red-600 hover:border-yellow-400 p-2 rounded-lg text-left transition flex flex-col justify-between h-14 cursor-pointer">
                            <span class="text-[10px] sm:text-xs text-red-500 font-bold">ZONE 11 🔥</span>
                            <span class="text-[9px] sm:text-[10px] text-gray-200 truncate">Ignis Boss</span>
                        </button>
                        <button id="btnLevel12" type="button" onclick="selectAndStartLevel(12)" data-category="volcanic"
                            class="arcade-btn bg-slate-900 border-2 border-amber-400 hover:border-yellow-400 p-2 rounded-lg text-left transition flex flex-col justify-between h-14 cursor-pointer">
                            <span class="text-[10px] sm:text-xs text-amber-300 font-bold">ZONE 12</span>
                            <span class="text-[9px] sm:text-[10px] text-gray-200 truncate">Molten Vault</span>
                        </button>
                    </div>
                </div>

                <button id="btnBackToMenu" type="button" onclick="closeLevelSelect()"
                    class="arcade-btn text-white text-xs px-6 py-2 rounded-lg font-bold tracking-widest cursor-pointer uppercase mt-2">
                    BACK TO MENU
                </button>
            </div>

            <!-- Pause Overlay -->
            <div id="pauseOverlay"
                class="absolute inset-0 bg-black/90 flex flex-col items-center justify-center p-6 text-center z-20 hidden">
                <h2 class="text-xl sm:text-3xl text-blue-400 mb-4 tracking-wider">GAME PAUSED</h2>
                <div class="flex flex-col gap-3 w-full max-w-xs">
                    <button id="btnResume" type="button" onclick="resumeGame()"
                        class="arcade-btn bg-emerald-600 text-white text-xs sm:text-sm px-6 py-3 rounded-lg font-bold tracking-widest cursor-pointer uppercase">
                        RESUME GAME
                    </button>
                    <button id="btnPauseLevelSelect" type="button" onclick="openLevelSelect()"
                        class="arcade-btn bg-purple-600 text-white text-xs sm:text-sm px-6 py-3 rounded-lg font-bold tracking-widest cursor-pointer uppercase">
                        SELECT LEVEL
                    </button>
                    <button id="btnRestartLevel" type="button" onclick="restartCurrentLevel()"
                        class="arcade-btn bg-amber-600 text-white text-xs sm:text-sm px-6 py-3 rounded-lg font-bold tracking-widest cursor-pointer uppercase">
                        RESTART LEVEL
                    </button>
                    <button id="btnPauseMainMenu" type="button" onclick="returnToMenu()"
                        class="arcade-btn bg-slate-800 text-gray-300 text-xs sm:text-sm px-6 py-3 rounded-lg font-bold tracking-widest cursor-pointer uppercase">
                        MAIN MENU
                    </button>
                </div>
            </div>

            <!-- Game Over / Victory Overlay -->
            <div id="messageOverlay"
                class="absolute inset-0 bg-black/85 flex flex-col items-center justify-center p-6 text-center z-20 hidden">
                <h2 id="msgTitle" class="text-xl sm:text-3xl text-red-500 mb-4">GAME OVER</h2>
                <p id="msgSub" class="text-xs sm:text-sm text-gray-300 mb-6">Final Score: 0</p>
                <div class="flex flex-col sm:flex-row gap-3">
                    <button id="btnRetryCheckpoint" type="button" onclick="restartFromCheckpoint()"
                        class="arcade-btn bg-emerald-600 text-white text-xs sm:text-sm px-5 py-3.5 rounded-lg font-bold tracking-widest cursor-pointer uppercase hidden">
                        RETRY CHECKPOINT
                    </button>
                    <button id="btnRestartAll" type="button" onclick="resetGame()"
                        class="arcade-btn text-white text-xs sm:text-sm px-5 py-3.5 rounded-lg font-bold tracking-widest cursor-pointer uppercase">
                        RESTART LVL 1
                    </button>
                    <button id="btnMsgMainMenu" type="button" onclick="returnToMenu()"
                        class="arcade-btn bg-purple-600 text-white text-xs sm:text-sm px-5 py-3.5 rounded-lg font-bold tracking-widest cursor-pointer uppercase">
                        MAIN MENU
                    </button>
                </div>
            </div>
        </div>

        <!-- Touch Controls for Mobile/Tablets -->
        <div class="flex justify-between items-center bg-slate-900 px-4 py-3 border-t-2 border-blue-600 sm:hidden">
            <div class="flex gap-2">
                <button id="btnLeft"
                    class="arcade-btn w-14 h-14 rounded-lg text-white font-bold text-lg flex items-center justify-center">◀</button>
                <button id="btnRight"
                    class="arcade-btn w-14 h-14 rounded-lg text-white font-bold text-lg flex items-center justify-center">▶</button>
            </div>
            <button id="btnJump"
                class="arcade-btn arcade-btn-jump w-24 h-14 rounded-lg text-white font-bold text-xs tracking-wider flex items-center justify-center">JUMP</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Set fixed internal resolution for sharp pixel arcade aesthetic
        canvas.width = 800;
        canvas.height = 500;

        // Game State Variables
        let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER, VICTORY
        let score = 0;
        let lives = 4;
        let currentLevel = 1;
        let cameraX = 0;

        // Input Tracking
        const keys = {};

        // Player Object
        const player = {
            x: 50,
            y: 250,
            width: 26,
            height: 36,
            vx: 0,
            vy: 0,
            speed: 4.5,
            jumpForce: -11.5,
            gravity: 0.52,
            grounded: false,
            hasDoubleJumped: false,
            color: '#38bdf8',
            facing: 'right'
        };

        // Level Elements
        let platforms = [];
        let coins = [];
        let hazards = [];
        let enemies = [];
        let particles = [];
        let goal = {};
        let levelBanner = { text: '', timer: 0 };

        // Boss & Checkpoint & Black Heart & Lava State Variables
        let boss = null;
        let ignisBoss = null;
        let bossProjectiles = [];
        let playerMissiles = [];
        let telegraphedAttacks = [];
        let flamePillars = [];
        let bossItem = null;
        let bossItemSpawnTimer = 0;
        let unlockedCheckpoint = 1;
        let checkpointScore = 0;
        let checkpointLevel = 1;
        let hasUnlockedBlackHeart = false;
        let hasBlackHeartShield = false;

        // Health & Lava System (2 HP = 1 Heart, 8 HP max = 4 Hearts)
        let playerHp = 8;
        let maxHp = 8;
        let invincibilityTimer = 0;
        let lavas = [];
        let lavaTimeFrames = 0;
        let lavaSurgeY = 440;
        let lavaSurgeTimer = 0;
        let currentLevelPage = 1;

        // Juice & FX System
        let playerScaleX = 1;
        let playerScaleY = 1;
        let coyoteTimer = 0;
        let jumpBufferTimer = 0;
        let screenShakeTimer = 0;
        let screenShakeIntensity = 0;
        let floatingTexts = [];
        let playerInLavaState = false;

        function triggerScreenShake(intensity = 6) {
            screenShakeTimer = 12;
            screenShakeIntensity = intensity;
        }

        function spawnFloatingText(x, y, text, color) {
            floatingTexts.push({
                x: x,
                y: y,
                text: text,
                color: color,
                alpha: 1.0,
                vy: -1.2
            });
        }

        function updateFloatingTexts() {
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.y += ft.vy;
                ft.alpha -= 0.025;
                if (ft.alpha <= 0) floatingTexts.splice(i, 1);
            }
        }

        function switchLevelPage(page) {
            currentLevelPage = page;
            const p1 = document.getElementById('lvlPage1');
            const p2 = document.getElementById('lvlPage2');
            const btn1 = document.getElementById('tabBtnPage1');
            const btn2 = document.getElementById('tabBtnPage2');

            if (page === 1) {
                p1.classList.remove('hidden');
                p2.classList.add('hidden');
                btn1.className = 'arcade-btn bg-purple-600 text-white text-[10px] sm:text-xs px-3 py-1.5 rounded font-bold uppercase cursor-pointer';
                btn2.className = 'arcade-btn bg-slate-800 border border-purple-500 text-gray-300 text-[10px] sm:text-xs px-3 py-1.5 rounded font-bold uppercase cursor-pointer';
            } else {
                p2.classList.remove('hidden');
                p1.classList.add('hidden');
                btn2.className = 'arcade-btn bg-purple-600 text-white text-[10px] sm:text-xs px-3 py-1.5 rounded font-bold uppercase cursor-pointer';
                btn1.className = 'arcade-btn bg-slate-800 border border-purple-500 text-gray-300 text-[10px] sm:text-xs px-3 py-1.5 rounded font-bold uppercase cursor-pointer';
            }
        }

        function loadLevel(lvl) {
            platforms = [];
            coins = [];
            hazards = [];
            lavas = [];
            enemies = [];
            particles = [];
            floatingTexts = [];
            cameraX = 0;
            boss = null;
            ignisBoss = null;
            bossProjectiles = [];
            playerMissiles = [];
            telegraphedAttacks = [];
            flamePillars = [];
            bossItem = null;
            lavaTimeFrames = 0;
            lavaSurgeY = 440;
            lavaSurgeTimer = 0;
            coyoteTimer = 0;
            jumpBufferTimer = 0;
            playerScaleX = 1;
            playerScaleY = 1;
            playerInLavaState = false;

            if (hasUnlockedBlackHeart) {
                hasBlackHeartShield = true;
            }

            const levelNames = {
                1: 'ZONE 1: NEON ROADS',
                2: 'ZONE 2: SKYWAY TOWERS',
                3: 'ZONE 3: VOID PITFALLS',
                4: 'ZONE 4: METROPOLIS CORE',
                5: 'ZONE 5: OMEGA SENTINEL [BOSS]',
                6: 'ZONE 6: SANCTUARY CHASM',
                7: 'ZONE 7: VOLCANIC CAVERNS',
                8: 'ZONE 8: MAGMA CATWALKS',
                9: 'ZONE 9: OBSIDIAN SPIRE',
                10: 'ZONE 10: INFERNO FOUNDRY',
                11: 'ZONE 11: IGNIS PRIME [BOSS]',
                12: 'ZONE 12: MOLTEN VAULT'
            };
            levelBanner = { text: levelNames[lvl] || `LEVEL ${lvl}`, timer: 120 };

            player.x = 60;
            player.y = 200;
            player.vx = 0;
            player.vy = 0;
            player.hasDoubleJumped = false;

            if (lvl === 1) {
                // Ground & Platforms
                platforms.push({ x: 0, y: 420, width: 650, height: 80, type: 'normal' });
                platforms.push({ x: 700, y: 360, width: 450, height: 140, type: 'normal' });
                platforms.push({ x: 1200, y: 300, width: 600, height: 200, type: 'normal' });

                // Floating platforms
                platforms.push({ x: 280, y: 300, width: 120, height: 20, type: 'normal' });
                platforms.push({ x: 470, y: 220, width: 110, height: 20, type: 'normal' });
                platforms.push({ x: 800, y: 240, width: 140, height: 20, type: 'normal' });
                platforms.push({ x: 1020, y: 160, width: 110, height: 20, type: 'normal' });

                // Hazards (Spikes)
                hazards.push({ x: 380, y: 400, width: 50, height: 20 });
                hazards.push({ x: 850, y: 340, width: 60, height: 20 });

                // Patrolling Enemies
                enemies.push({
                    type: 'ground', x: 200, y: 390, startX: 120, endX: 380, width: 30, height: 30, speed: 2, direction: 1
                });
                enemies.push({
                    type: 'ground', x: 780, y: 330, startX: 720, endX: 1020, width: 30, height: 30, speed: 2.2, direction: 1
                });

                // Collectible Coins
                coins.push({ x: 340, y: 250, collected: false });
                coins.push({ x: 520, y: 170, collected: false });
                coins.push({ x: 750, y: 310, collected: false });
                coins.push({ x: 860, y: 190, collected: false });
                coins.push({ x: 1070, y: 110, collected: false });
                coins.push({ x: 1400, y: 250, collected: false });

                // Goal Portal
                goal = { x: 1600, y: 200, width: 40, height: 100 };
            } else if (lvl === 2) {
                // Advanced level layout
                platforms.push({ x: 0, y: 420, width: 400, height: 80, type: 'normal' });
                platforms.push({ x: 480, y: 350, width: 160, height: 20, type: 'normal' });
                platforms.push({ x: 740, y: 280, width: 160, height: 20, type: 'normal' });
                platforms.push({ x: 1000, y: 210, width: 220, height: 20, type: 'normal' });
                platforms.push({ x: 1320, y: 340, width: 500, height: 160, type: 'normal' });

                // Hazards
                hazards.push({ x: 530, y: 330, width: 60, height: 20 });
                hazards.push({ x: 1080, y: 190, width: 70, height: 20 });
                hazards.push({ x: 1450, y: 320, width: 90, height: 20 });

                // Patrolling Enemies
                enemies.push({
                    type: 'ground', x: 1030, y: 180, startX: 1010, endX: 1180, width: 30, height: 30, speed: 2.8, direction: 1
                });
                enemies.push({
                    type: 'ground', x: 1380, y: 310, startX: 1340, endX: 1650, width: 30, height: 30, speed: 2.5, direction: 1
                });

                // Collectible Coins
                coins.push({ x: 280, y: 370, collected: false });
                coins.push({ x: 560, y: 300, collected: false });

        let previousGameState = 'MENU';

        function showOverlay(overlayId) {
            const overlays = ['menuOverlay', 'levelSelectOverlay', 'pauseOverlay', 'messageOverlay'];
            overlays.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    if (id === overlayId) {
                        el.classList.remove('hidden');
                    } else {
                        el.classList.add('hidden');
                    }
                }
            });
        }

        window.addEventListener('keydown', e => {
            // Escape or P toggles Pause during play / goes back from menus
            if (e.code === 'Escape' || e.code === 'KeyP') {
                if (gameState === 'PLAYING') {
                    pauseGame();
                    e.preventDefault();
                } else if (gameState === 'PAUSED') {
                    resumeGame();
                    e.preventDefault();
                } else if (gameState === 'LEVEL_SELECT') {
                    closeLevelSelect();
                    e.preventDefault();
                }
                return;
            }

            // Only capture jump & movement keys when actively playing!
            if (gameState === 'PLAYING') {
                if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
                    handleJump();
                    e.preventDefault();
                }
                keys[e.code] = true;
                if (['ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyA', 'KeyD'].includes(e.code)) {
                    e.preventDefault();
                }
            }
        });

        window.addEventListener('keyup', e => {
            keys[e.code] = false;
        });

        function handleJump() {
            if (gameState !== 'PLAYING') return;
            jumpBufferTimer = 8;
            executeBufferedJump();
        }

        function executeBufferedJump() {
            if (gameState !== 'PLAYING' || jumpBufferTimer <= 0) return;

            let inLava = playerInLavaState;

            if (player.grounded || coyoteTimer > 0 || inLava) {
                player.vy = player.jumpForce;
                player.grounded = false;
                coyoteTimer = 0;
                jumpBufferTimer = 0;
                player.hasDoubleJumped = false;
                playerScaleX = 0.75;
                playerScaleY = 1.25;
                spawnParticles(player.x + player.width / 2, player.y + player.height, inLava ? '#f97316' : '#38bdf8', inLava ? 10 : 6);
            } else if (!player.hasDoubleJumped) {
                player.vy = player.jumpForce * 0.9;
                player.hasDoubleJumped = true;
                jumpBufferTimer = 0;
                playerScaleX = 0.8;
                playerScaleY = 1.2;
                spawnParticles(player.x + player.width / 2, player.y + player.height / 2, '#ec4899', 10);
            }
        }

        // Touch Control bindings
        function bindTouch(id, code, isJump = false) {
            const el = document.getElementById(id);
            if (!el) return;
            const triggerOn = (e) => {
                if (gameState === 'PLAYING') {
                    e.preventDefault();
                    if (isJump) handleJump();
                    else keys[code] = true;
                }
            };
            const triggerOff = (e) => {
                if (gameState === 'PLAYING') {
                    e.preventDefault();
                    if (!isJump) keys[code] = false;
                }
            };

            el.addEventListener('touchstart', triggerOn, { passive: false });
            el.addEventListener('touchend', triggerOff, { passive: false });
            el.addEventListener('mousedown', triggerOn);
            el.addEventListener('mouseup', triggerOff);
        }
        bindTouch('btnLeft', 'ArrowLeft', false);
        bindTouch('btnRight', 'ArrowRight', false);
        bindTouch('btnJump', 'Space', true);

        function spawnParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    radius: Math.random() * 3 + 1,
                    color: color,
                    alpha: 1
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha <= 0) particles.splice(i, 1);
            }
        }

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                rect1.x + rect1.width > rect2.x &&
                rect1.y < rect2.y + rect2.height &&
                rect1.y + rect1.height > rect2.y;
        }

            showOverlay(null);
            score = 0;

            checkpointScore = 0;
            checkpointLevel = 1;
            updateHUD();
            loadLevel(currentLevel);

            previousGameState = gameState;
            gameState = 'LEVEL_SELECT';
            showOverlay('levelSelectOverlay');
