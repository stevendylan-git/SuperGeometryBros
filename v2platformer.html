            if (previousGameState === 'PAUSED') {
                gameState = 'PAUSED';
                showOverlay('pauseOverlay');
            } else {
                gameState = 'MENU';
                showOverlay('menuOverlay');
            }
        }

        function filterLevelGrid(category) {
            const btnAll = document.getElementById('tabBtnAll');
            const btnCyber = document.getElementById('tabBtnCyber');
            const btnVolcanic = document.getElementById('tabBtnVolcanic');

            const setTabStyle = (btn, active) => {
                if (!btn) return;
                btn.className = active
                    ? 'arcade-btn bg-purple-600 text-white px-2.5 py-1 rounded font-bold uppercase cursor-pointer'
                    : 'arcade-btn bg-slate-800 border border-purple-500 text-gray-300 px-2.5 py-1 rounded font-bold uppercase cursor-pointer';
            };

            setTabStyle(btnAll, category === 'all');
            setTabStyle(btnCyber, category === 'cyber');
            setTabStyle(btnVolcanic, category === 'volcanic');

            for (let i = 1; i <= 12; i++) {
                const btn = document.getElementById(`btnLevel${i}`);
                if (btn) {
                    const cat = btn.getAttribute('data-category');
                    if (category === 'all' || cat === category) {
                        btn.classList.remove('hidden');
                    } else {
                        btn.classList.add('hidden');
                    }
                }
            }
        }

        function selectAndStartLevel(lvl) {
            showOverlay(null);
            score = 0;
            playerHp = 8;
            lives = Math.ceil(playerHp / 2);
            currentLevel = lvl;
            updateHUD();
            loadLevel(currentLevel);
            gameState = 'PLAYING';
        }

        function togglePause() {
            if (gameState === 'PLAYING') {
                pauseGame();
            } else if (gameState === 'PAUSED') {
                resumeGame();
            }
        }

        function pauseGame() {
            if (gameState !== 'PLAYING') return;
            gameState = 'PAUSED';
            showOverlay('pauseOverlay');
        }

        function resumeGame() {
            showOverlay(null);
            gameState = 'PLAYING';
        }

        function restartCurrentLevel() {
            showOverlay(null);
            playerHp = 8;
            lives = Math.ceil(playerHp / 2);
            updateHUD();
            loadLevel(currentLevel);
            gameState = 'PLAYING';
        }

        function returnToMenu() {
            showOverlay('menuOverlay');
            gameState = 'MENU';
        }

        function resetGame() {
            showOverlay(null);
            startGame();
        }

        function restartFromCheckpoint() {
            showOverlay(null);
            currentLevel = checkpointLevel;
            playerHp = 8;
            lives = 4;
            score = checkpointScore;
            updateHUD();
            loadLevel(currentLevel);
            gameState = 'PLAYING';
        }

        function takeDamage(hpAmount = 1) {
            if (invincibilityTimer > 0) return false;

            if (hasBlackHeartShield) {
                // Black Heart shield nullifies this instance of damage!
                hasBlackHeartShield = false;
                invincibilityTimer = 35; // ~0.6s invulnerability
                updateHUD();
                triggerScreenShake(6);
                spawnFloatingText(player.x + player.width / 2, player.y - 10, 'SHIELD BLOCKED!', '#c084fc');
                spawnParticles(player.x + player.width / 2, player.y + player.height / 2, '#334155', 20);
                spawnParticles(player.x + player.width / 2, player.y + player.height / 2, '#c084fc', 20);
                return true;
            }

            playerHp -= hpAmount;
            if (playerHp < 0) playerHp = 0;
            lives = Math.ceil(playerHp / 2);
            invincibilityTimer = 25; // ~0.4s invulnerability
            updateHUD();
            triggerScreenShake(8);
            playerScaleX = 1.3;
            playerScaleY = 0.7;

            let dmgText = hpAmount === 1 ? '-0.5 ❤️' : '-1 ❤️';
            spawnFloatingText(player.x + player.width / 2, player.y - 10, dmgText, '#ef4444');
            spawnParticles(player.x + player.width / 2, player.y + player.height / 2, '#ef4444', 15);

            if (playerHp <= 0) {
                gameState = 'GAMEOVER';
                document.getElementById('msgTitle').innerText = 'GAME OVER';
                document.getElementById('msgTitle').className = 'text-xl sm:text-3xl text-red-500 mb-4';
                document.getElementById('msgSub').innerText = `Final Score: ${score}`;

                const retryBtn = document.getElementById('btnRetryCheckpoint');
                const mainBtn = document.getElementById('btnRestartAll');

                if (unlockedCheckpoint > 1) {
                    retryBtn.classList.remove('hidden');
                    retryBtn.innerText = `RETRY CHECKPOINT (LVL ${checkpointLevel})`;
                    mainBtn.innerText = 'RESTART LVL 1';
                } else {
                    retryBtn.classList.add('hidden');
                    mainBtn.innerText = 'PLAY AGAIN';
                }

                document.getElementById('messageOverlay').classList.remove('hidden');
            }
            return true;
        }

        function loseLife() {
            // Full heart / spike / enemy collision damage (2 HP = 1 full heart)
            if (hasBlackHeartShield) {
                hasBlackHeartShield = false;
                invincibilityTimer = 35;
                updateHUD();
                spawnParticles(player.x + player.width / 2, player.y + player.height / 2, '#334155', 20);
                spawnParticles(player.x + player.width / 2, player.y + player.height / 2, '#c084fc', 20);
                if (player.y > canvas.height) {
                    player.x = (currentLevel === 5 || currentLevel === 11) ? 100 : 60;
                    player.y = (currentLevel === 5 || currentLevel === 11) ? 260 : 200;
                    player.vx = 0;
                    player.vy = 0;
                    cameraX = 0;
                }
                return;
            }

            takeDamage(2);

            if (playerHp > 0 && player.y > canvas.height) {
                // Respawn safely
                player.x = (currentLevel === 5 || currentLevel === 11) ? 100 : 60;
                player.y = (currentLevel === 5 || currentLevel === 11) ? 260 : 200;
                player.vx = 0;
                player.vy = 0;
                player.hasDoubleJumped = false;
                cameraX = 0;
            }
        }

        function nextLevel() {
            if (currentLevel === 4) {
                // Checkpoint 1 after Level 4 (Level 5 Boss Fight)
                unlockedCheckpoint = 5;
                checkpointLevel = 5;
                checkpointScore = score;
                currentLevel = 5;
                document.getElementById('levelVal').innerText = currentLevel;
                loadLevel(5);
            } else if (currentLevel === 5) {
                // Defeating Omega Sentinel unlocks Black Heart shield & Checkpoint 2!
                hasUnlockedBlackHeart = true;
                hasBlackHeartShield = true;
                unlockedCheckpoint = 6;
                checkpointLevel = 6;
                checkpointScore = score;
                currentLevel = 6;
                document.getElementById('levelVal').innerText = currentLevel;
                loadLevel(6);
                levelBanner = { text: 'BLACK HEART UNLOCKED! (SHIELD ACTIVE)', timer: 140 };
            } else if (currentLevel === 10) {
                // Checkpoint 3 before Level 11 Ignis Prime Boss
                unlockedCheckpoint = 11;
                checkpointLevel = 11;
                checkpointScore = score;
                currentLevel = 11;
                document.getElementById('levelVal').innerText = currentLevel;
                loadLevel(11);
            } else if (currentLevel === 11) {
                // Defeating Ignis Prime unlocks Checkpoint 4 & moves to Level 12 Victory Vault!
                unlockedCheckpoint = 12;
                checkpointLevel = 12;
                checkpointScore = score;
                currentLevel = 12;
                document.getElementById('levelVal').innerText = currentLevel;
                loadLevel(12);
                levelBanner = { text: 'IGNIS PRIME VANQUISHED! MOLTEN VAULT UNLOCKED', timer: 150 };
            } else if (currentLevel < 12) {
                currentLevel++;
                document.getElementById('levelVal').innerText = currentLevel;
                loadLevel(currentLevel);
            } else {
                gameState = 'VICTORY';
                document.getElementById('msgTitle').innerText = 'ULTIMATE VICTORY!';
                document.getElementById('msgTitle').className = 'text-xl sm:text-3xl text-yellow-400 mb-4';
                document.getElementById('msgSub').innerText = `You Conquered All 12 Levels & Defeated Both Bosses! Final Score: ${score}`;

                const retryBtn = document.getElementById('btnRetryCheckpoint');
                const mainBtn = document.getElementById('btnRestartAll');
                retryBtn.classList.add('hidden');
                mainBtn.innerText = 'PLAY AGAIN';
                document.getElementById('messageOverlay').classList.remove('hidden');
            }
        }

        function updateHUD() {
            document.getElementById('scoreVal').innerText = score;
            document.getElementById('levelVal').innerText = currentLevel;
            let fullHearts = Math.floor(playerHp / 2);
            let halfHeart = (playerHp % 2 === 1);
            let hearts = '';

            for (let i = 0; i < fullHearts; i++) {
                if (hasBlackHeartShield && i === fullHearts - 1 && !halfHeart) {
                    hearts += '🖤';
                } else {
                    hearts += '❤️';
                }
            }
            if (halfHeart) {
                if (hasBlackHeartShield && fullHearts === 0) {
                    hearts += '🖤';
                } else {
                    hearts += '💔';
                }
            }
            if (hearts === '') hearts = '💀';
            document.getElementById('livesContainer').innerText = hearts;
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            if (invincibilityTimer > 0) invincibilityTimer--;
            if (jumpBufferTimer > 0) {
                jumpBufferTimer--;
                executeBufferedJump();
            }

            // Smooth scale recovery for squash & stretch
            playerScaleX += (1 - playerScaleX) * 0.15;
            playerScaleY += (1 - playerScaleY) * 0.15;

            updateFloatingTexts();

            // Horizontal Controls
            player.vx = 0;
            if (keys['ArrowLeft'] || keys['KeyA']) {
                player.vx = -player.speed;
                player.facing = 'left';
            }
            if (keys['ArrowRight'] || keys['KeyD']) {
                player.vx = player.speed;
                player.facing = 'right';
            }

            player.x += player.vx;

            // Horizontal platform collisions
            platforms.forEach(plat => {
                if (checkCollision(player, plat)) {
                    if (player.vx > 0) player.x = plat.x - player.width;
                    else if (player.vx < 0) player.x = plat.x + plat.width;
                }
            });

            // Vertical Gravity
            player.vy += player.gravity;
            player.y += player.vy;

            // Coyote Time Tracking
            if (player.grounded) {
                coyoteTimer = 6;
            } else if (coyoteTimer > 0) {
                coyoteTimer--;
            }

            player.grounded = false;

            // Vertical platform collisions
            platforms.forEach(plat => {
                if (checkCollision(player, plat)) {
                    if (player.vy > 0) { // Landing on top
                        if (!player.grounded) {
                            // Squash on impact
                            playerScaleX = 1.2;
                            playerScaleY = 0.8;
                            spawnParticles(player.x + player.width / 2, plat.y, '#94a3b8', 4);
                        }
                        player.y = plat.y - player.height;
                        player.vy = 0;
                        player.grounded = true;
                        player.hasDoubleJumped = false;
                    } else if (player.vy < 0) { // Hitting underside
                        player.y = plat.y + plat.height;
                        player.vy = 0;
                    }
                }
            });

            // LAVA HAZARD & FLUID MECHANICS
            let playerInLava = false;
            lavas.forEach(lava => {
                let actualLavaY = (currentLevel === 11 && ignisBoss && ignisBoss.surging) ? lavaSurgeY : lava.y;
                let actualLavaH = (currentLevel === 11 && ignisBoss && ignisBoss.surging) ? (500 - lavaSurgeY) : lava.height;

                if (checkCollision(player, { x: lava.x, y: actualLavaY, width: lava.width, height: actualLavaH })) {
                    playerInLava = true;
                }
            });

            playerInLavaState = playerInLava;

            if (playerInLava) {
                // Liquid drag & buoyancy in molten lava
                player.vy = Math.min(player.vy, 2.2);
                player.vx *= 0.88;

                lavaTimeFrames++;

                // Deal half-heart damage (1 HP) immediately on touch or every 40 frames (~0.66s) while inside
                if (lavaTimeFrames === 1 || (lavaTimeFrames > 40 && (lavaTimeFrames - 1) % 40 === 0)) {
                    let tookDmg = takeDamage(1);
                    if (tookDmg) {
                        // Upward thermal bounce recoil so player isn't trapped or dragged into pitfall!
                        player.vy = -8.5;
                        player.grounded = false;
                        spawnParticles(player.x + player.width / 2, player.y + player.height, '#ff4500', 16);
                        spawnParticles(player.x + player.width / 2, player.y + player.height, '#facc15', 12);
                    }
                }

                // Sizzle steam and ember particles
                if (Math.random() < 0.5) {
                    spawnParticles(player.x + player.width / 2, player.y + player.height, Math.random() < 0.5 ? '#f97316' : '#ef4444', 3);
                }
            } else {
                lavaTimeFrames = 0;
            }

            // Update Patrolling Enemies
            enemies.forEach(enemy => {
                if (enemy.type === 'flying') {
                    // Vertical flying patrol
                    enemy.y += enemy.speed * enemy.direction;
                    if (enemy.y <= enemy.startY) {
                        enemy.y = enemy.startY;
                        enemy.direction = 1;
                    } else if (enemy.y >= enemy.endY) {
                        enemy.y = enemy.endY;
                        enemy.direction = -1;
                    }
                    enemy.wingAnim = (enemy.wingAnim || 0) + 0.2;
                } else {
                    // Horizontal ground patrol
                    enemy.x += enemy.speed * enemy.direction;
                    if (enemy.x <= enemy.startX) {
                        enemy.x = enemy.startX;
                        enemy.direction = 1;
                    } else if (enemy.x >= enemy.endX) {
                        enemy.x = enemy.endX;
                        enemy.direction = -1;
                    }
                }

                // Check collision with player
                if (checkCollision(player, enemy)) {
                    loseLife();
                }
            });

            // Coin Collection
            coins.forEach(coin => {
                if (!coin.collected && checkCollision(player, { x: coin.x - 10, y: coin.y - 10, width: 20, height: 20 })) {
                    coin.collected = true;
                    score += 100;
                    updateHUD();
                    spawnFloatingText(coin.x, coin.y - 10, '+100', '#facc15');
                    spawnParticles(coin.x, coin.y, '#facc15', 10);
                }
            });

            // Player arena boundary check for Boss levels
            if (currentLevel === 5 || currentLevel === 11) {
                if (player.x < 0) player.x = 0;
                if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
            }

            // LEVEL 5 OMEGA SENTINEL BOSS LOGIC
            if (currentLevel === 5 && boss) {
                boss.angle += 0.025;
                boss.x = 400 + Math.sin(boss.angle) * 220;
                boss.y = 110 + Math.cos(boss.angle * 2) * 35;

                if (boss.hitFlashTimer > 0) boss.hitFlashTimer--;

                boss.attackTimer++;
                if (boss.attackTimer >= 120 && telegraphedAttacks.length < 2) {
                    boss.attackTimer = 0;
                    let attackTypes = ['aimed', 'spread', 'rain', 'cross'];
                    let chosenType = attackTypes[Math.floor(Math.random() * attackTypes.length)];
                    let newAttack = { type: chosenType, timer: 85, maxTimer: 85, paths: [] };

                    if (chosenType === 'aimed') {
                        let dx = (player.x + player.width / 2) - boss.x;
                        let dy = (player.y + player.height / 2) - boss.y;
                        let dist = Math.hypot(dx, dy) || 1;
                        let spd = 9.8;
                        newAttack.paths.push({ startX: boss.x, startY: boss.y, endX: boss.x + (dx / dist) * 900, endY: boss.y + (dy / dist) * 900, vx: (dx / dist) * spd, vy: (dy / dist) * spd, radius: 8, color: '#ef4444' });
                    } else if (chosenType === 'spread') {
                        let baseAng = Math.atan2((player.y + 18) - boss.y, (player.x + 13) - boss.x);
                        let spd = 9.2;
                        for (let offset of [-0.35, 0, 0.35]) {
                            let ang = baseAng + offset;
                            newAttack.paths.push({ startX: boss.x, startY: boss.y, endX: boss.x + Math.cos(ang) * 900, endY: boss.y + Math.sin(ang) * 900, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, radius: 7, color: '#f97316' });
                        }
                    } else if (chosenType === 'rain') {
                        for (let i = 0; i < 3; i++) {
                            let rx = 120 + Math.random() * 560;
                            newAttack.paths.push({ startX: rx, startY: 0, endX: rx, endY: 500, vx: (Math.random() - 0.5) * 1, vy: 10.5, radius: 8, color: '#eab308' });
                        }
                    } else if (chosenType === 'cross') {
                        let sweepY = Math.min(380, Math.max(160, player.y + 10));
                        let fromLeft = Math.random() < 0.5;
                        newAttack.paths.push({ startX: fromLeft ? -20 : 820, startY: sweepY, endX: fromLeft ? 820 : -20, endY: sweepY, vx: fromLeft ? 12.0 : -12.0, vy: 0, radius: 9, color: '#06b6d4' });
                    }
                    telegraphedAttacks.push(newAttack);
                }

                for (let i = telegraphedAttacks.length - 1; i >= 0; i--) {
                    let atk = telegraphedAttacks[i];
                    atk.timer--;
                    if (atk.timer <= 0) {
                        atk.paths.forEach(p => {
                            bossProjectiles.push({ x: p.startX, y: p.startY, vx: p.vx, vy: p.vy, radius: p.radius, color: p.color });
                            spawnParticles(p.startX, p.startY, p.color, 6);
                        });
                        telegraphedAttacks.splice(i, 1);
                    }
                }

                for (let i = bossProjectiles.length - 1; i >= 0; i--) {
                    let p = bossProjectiles[i];
                    p.x += p.vx;
                    p.y += p.vy;

                    if (checkCollision(player, { x: p.x - p.radius, y: p.y - p.radius, width: p.radius * 2, height: p.radius * 2 })) {
                        spawnParticles(p.x, p.y, '#ef4444', 12);
                        bossProjectiles.splice(i, 1);
                        loseLife();
                        continue;
                    }
                    if (p.x < -30 || p.x > 830 || p.y < -30 || p.y > 530) bossProjectiles.splice(i, 1);
                }

                if (!bossItem) {
                    bossItemSpawnTimer--;
                    if (bossItemSpawnTimer <= 0) {
                        let spawnPlats = [1, 2, 3, 4];
                        let targetPlat = platforms[spawnPlats[Math.floor(Math.random() * spawnPlats.length)]];
                        bossItem = { x: targetPlat.x + targetPlat.width / 2 - 12, y: targetPlat.y - 36, width: 24, height: 24, floatAnim: 0 };
                        spawnParticles(bossItem.x + 12, bossItem.y + 12, '#facc15', 10);
                    }
                } else {
                    bossItem.floatAnim += 0.08;
                    if (checkCollision(player, bossItem)) {
                        spawnParticles(bossItem.x + 12, bossItem.y + 12, '#facc15', 15);
                        spawnParticles(bossItem.x + 12, bossItem.y + 12, '#38bdf8', 15);
                        playerMissiles.push({ x: player.x + player.width / 2, y: player.y, speed: 9.5 });
                        bossItem = null;
                        bossItemSpawnTimer = 110;
                    }
                }

                for (let i = playerMissiles.length - 1; i >= 0; i--) {
                    let m = playerMissiles[i];
                    let dx = boss.x - m.x;
                    let dy = boss.y - m.y;
                    let dist = Math.hypot(dx, dy);

                    if (dist < 18) {
                        boss.hp--;
                        boss.hitFlashTimer = 14;
                        score += 500;
                        updateHUD();
                        spawnParticles(boss.x, boss.y, '#38bdf8', 20);
                        spawnParticles(boss.x, boss.y, '#facc15', 20);
                        playerMissiles.splice(i, 1);

                        if (boss.hp <= 0) {
                            spawnParticles(boss.x, boss.y, '#ef4444', 35);
                            spawnParticles(boss.x, boss.y, '#a855f7', 35);
                            spawnParticles(boss.x, boss.y, '#38bdf8', 35);
                            score += 2500;
                            updateHUD();
                            nextLevel();
                        }
                    } else {
                        m.x += (dx / dist) * m.speed;
                        m.y += (dy / dist) * m.speed;
                    }
                }
            }

            // LEVEL 11 IGNIS PRIME BOSS LOGIC (Fiery Lava Titan!)
            if (currentLevel === 11 && ignisBoss) {
                ignisBoss.angle += 0.03;
                ignisBoss.x = 400 + Math.sin(ignisBoss.angle) * 200;
                ignisBoss.y = 110 + Math.sin(ignisBoss.angle * 2) * 25;

                if (ignisBoss.hitFlashTimer > 0) ignisBoss.hitFlashTimer--;

                // Periodic Lava Floor Surge Mechanic
                ignisBoss.surgeTimer++;
                if (ignisBoss.surgeTimer > 320) {
                    ignisBoss.surging = true;
                    lavaSurgeY = 440 - Math.sin((ignisBoss.surgeTimer - 320) / 40) * 80;
                    if (ignisBoss.surgeTimer > 460) {
                        ignisBoss.surging = false;
                        ignisBoss.surgeTimer = 0;
                        lavaSurgeY = 440;
                    }
                }

                // Attack Patterns: Telegraphed Flame Pillars & Magma Fireballs
                ignisBoss.attackTimer++;
                if (ignisBoss.attackTimer >= 105 && telegraphedAttacks.length < 2) {
                    ignisBoss.attackTimer = 0;
                    let atkType = Math.random() < 0.5 ? 'flame_pillar' : 'magma_salvo';

                    if (atkType === 'flame_pillar') {
                        let targetX = player.x + player.width / 2;
                        telegraphedAttacks.push({
                            type: 'flame_pillar',
                            timer: 70,
                            maxTimer: 70,
                            x: targetX,
                            width: 44
                        });
                    } else {
                        let baseAng = Math.atan2((player.y + 18) - ignisBoss.y, (player.x + 13) - ignisBoss.x);
                        let spd = 9.5;
                        let newAtk = { type: 'magma_salvo', timer: 65, maxTimer: 65, paths: [] };
                        for (let offset of [-0.3, 0, 0.3]) {
                            let ang = baseAng + offset;
                            newAtk.paths.push({
                                startX: ignisBoss.x, startY: ignisBoss.y,
                                endX: ignisBoss.x + Math.cos(ang) * 900, endY: ignisBoss.y + Math.sin(ang) * 900,
                                vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
                                radius: 8, color: '#f97316'
                            });
                        }
                        telegraphedAttacks.push(newAtk);
                    }
                }

                // Process Ignis Telegraphed Attacks
                for (let i = telegraphedAttacks.length - 1; i >= 0; i--) {
                    let atk = telegraphedAttacks[i];
                    atk.timer--;
                    if (atk.timer <= 0) {
                        if (atk.type === 'flame_pillar') {
                            flamePillars.push({ x: atk.x - atk.width / 2, y: 0, width: atk.width, height: 500, timer: 40 });
                            spawnParticles(atk.x, 440, '#f97316', 20);
                        } else if (atk.paths) {
                            atk.paths.forEach(p => {
                                bossProjectiles.push({ x: p.startX, y: p.startY, vx: p.vx, vy: p.vy, radius: p.radius, color: p.color });
                            });
                        }
                        telegraphedAttacks.splice(i, 1);
                    }
                }

                // Update Active Flame Pillars
                for (let i = flamePillars.length - 1; i >= 0; i--) {
                    let fp = flamePillars[i];
                    fp.timer--;
                    if (checkCollision(player, fp)) {
                        takeDamage(1); // Flame pillar half-heart hit
                    }
                    if (fp.timer <= 0) flamePillars.splice(i, 1);
                }

                // Update Ignis Boss Projectiles
                for (let i = bossProjectiles.length - 1; i >= 0; i--) {
                    let p = bossProjectiles[i];
                    p.x += p.vx;
                    p.y += p.vy;

                    if (checkCollision(player, { x: p.x - p.radius, y: p.y - p.radius, width: p.radius * 2, height: p.radius * 2 })) {
                        spawnParticles(p.x, p.y, '#f97316', 15);
                        bossProjectiles.splice(i, 1);
                        takeDamage(1);
                        continue;
                    }
                    if (p.x < -30 || p.x > 830 || p.y < -30 || p.y > 530) bossProjectiles.splice(i, 1);
                }

                // Frost Crystal Cores (Damage Item for Ignis Prime)
                if (!bossItem) {
                    bossItemSpawnTimer--;
                    if (bossItemSpawnTimer <= 0) {
                        let spawnPlats = [1, 2, 3, 4];
                        let targetPlat = platforms[spawnPlats[Math.floor(Math.random() * spawnPlats.length)]];
                        bossItem = { x: targetPlat.x + targetPlat.width / 2 - 12, y: targetPlat.y - 36, width: 24, height: 24, floatAnim: 0, isIce: true };
                        spawnParticles(bossItem.x + 12, bossItem.y + 12, '#38bdf8', 12);
                    }
                } else {
                    bossItem.floatAnim += 0.08;
                    if (checkCollision(player, bossItem)) {
                        spawnParticles(bossItem.x + 12, bossItem.y + 12, '#38bdf8', 25);
                        playerMissiles.push({ x: player.x + player.width / 2, y: player.y, speed: 10.5, isIce: true });
                        bossItem = null;
                        bossItemSpawnTimer = 100;
                    }
                }

                // Update Player Cryo Missiles hitting Ignis Prime
                for (let i = playerMissiles.length - 1; i >= 0; i--) {
                    let m = playerMissiles[i];
                    let dx = ignisBoss.x - m.x;
                    let dy = ignisBoss.y - m.y;
                    let dist = Math.hypot(dx, dy);

                    if (dist < 22) {
                        ignisBoss.hp--;
                        ignisBoss.hitFlashTimer = 14;
                        score += 500;
                        updateHUD();
                        spawnParticles(ignisBoss.x, ignisBoss.y, '#38bdf8', 25);
                        spawnParticles(ignisBoss.x, ignisBoss.y, '#93c5fd', 25);
                        playerMissiles.splice(i, 1);

                        if (ignisBoss.hp <= 0) {
                            spawnParticles(ignisBoss.x, ignisBoss.y, '#ef4444', 40);
                            spawnParticles(ignisBoss.x, ignisBoss.y, '#38bdf8', 40);
                            score += 3000;
                            updateHUD();
                            nextLevel();
                        }
                    } else {
                        m.x += (dx / dist) * m.speed;
                        m.y += (dy / dist) * m.speed;
                        particles.push({ x: m.x, y: m.y, vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2, radius: 2.5, color: '#38bdf8', alpha: 0.8 });
                    }
                }
            }

            // Hazard Collisions (Spikes)
            hazards.forEach(hz => {
                if (checkCollision(player, hz)) {
                    loseLife();
                }
            });

            // Pitfall check
            if (player.y > canvas.height + 50) {
                loseLife();
            }

            // Goal Collision
            if (goal.x !== undefined && checkCollision(player, goal)) {
                nextLevel();
            }

            // Camera follow smoothing
            if (currentLevel === 5 || currentLevel === 11) {
                cameraX = 0;
            } else {
                let targetCameraX = player.x - canvas.width / 3;
                if (targetCameraX < 0) targetCameraX = 0;
                cameraX += (targetCameraX - cameraX) * 0.1;
            }

            updateParticles();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let shakeX = 0;
            let shakeY = 0;
            if (screenShakeTimer > 0) {
                screenShakeTimer--;
                shakeX = (Math.random() - 0.5) * screenShakeIntensity;
                shakeY = (Math.random() - 0.5) * screenShakeIntensity;
            }

            ctx.save();
            ctx.translate(-cameraX + shakeX, shakeY);

            // Background Atmosphere with Parallax & Theme Details
            ctx.fillStyle = (currentLevel >= 7 && currentLevel <= 11) ? '#140505' : '#060913';
            ctx.fillRect(cameraX - 40, 0, canvas.width + 80, canvas.height);

            // Parallax Ambient Grid Lines
            ctx.save();
            ctx.globalAlpha = 0.12;
            let gridOffset = (cameraX * 0.3) % 40;
            ctx.strokeStyle = (currentLevel >= 7 && currentLevel <= 11) ? '#f97316' : '#38bdf8';
            ctx.lineWidth = 1;
            for (let x = cameraX - gridOffset - 40; x < cameraX + canvas.width + 40; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            ctx.restore();

            // Draw Platforms
            platforms.forEach(plat => {
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
                ctx.strokeStyle = (currentLevel >= 7 && currentLevel <= 11) ? '#f97316' : '#3b82f6';
                ctx.lineWidth = 2;
                ctx.strokeRect(plat.x, plat.y, plat.width, plat.height);

                ctx.fillStyle = (currentLevel >= 7 && currentLevel <= 11) ? '#f9731644' : '#3b82f644';
                ctx.fillRect(plat.x + 12, plat.y + 6, 16, 4);
                ctx.fillRect(plat.x + 40, plat.y + 6, 16, 4);
            });

            // Draw LAVA Pools (Volcanic hazard with bubbling animated surface)
            lavas.forEach(lava => {
                let lavaY = (currentLevel === 11 && ignisBoss && ignisBoss.surging) ? lavaSurgeY : lava.y;
                let lavaH = (currentLevel === 11 && ignisBoss && ignisBoss.surging) ? (500 - lavaSurgeY) : lava.height;

                // Glowing Lava gradient fill
                let lavaGrad = ctx.createLinearGradient(0, lavaY, 0, lavaY + lavaH);
                lavaGrad.addColorStop(0, '#ff4500');
                lavaGrad.addColorStop(0.4, '#dc2626');
                lavaGrad.addColorStop(1, '#7f1d1d');
                ctx.fillStyle = lavaGrad;
                ctx.fillRect(lava.x, lavaY, lava.width, lavaH);

                // Lava Top Surface Bubbling Wave
                ctx.fillStyle = '#facc15';
                ctx.beginPath();
                ctx.moveTo(lava.x, lavaY);
                for (let x = lava.x; x <= lava.x + lava.width; x += 15) {
                    let waveY = lavaY + Math.sin((Date.now() / 150) + (x * 0.05)) * 4;
                    ctx.lineTo(x, waveY);
                }
                ctx.lineTo(lava.x + lava.width, lavaY + 6);
                ctx.lineTo(lava.x, lavaY + 6);
                ctx.closePath();
                ctx.fill();
            });

            // Draw Hazards (Spikes)
            hazards.forEach(hz => {
                ctx.fillStyle = '#ef4444';
                let spikeW = 15;
                let count = Math.ceil(hz.width / spikeW);
                for (let i = 0; i < count; i++) {
                    ctx.beginPath();
                    ctx.moveTo(hz.x + (i * spikeW), hz.y + hz.height);
                    ctx.lineTo(hz.x + (i * spikeW) + spikeW / 2, hz.y);
                    ctx.lineTo(hz.x + ((i + 1) * spikeW), hz.y + hz.height);
                    ctx.closePath();
                    ctx.fill();
                }
            });

            // Draw Patrolling Enemies
            enemies.forEach(enemy => {
                if (enemy.type === 'flying') {
                    ctx.save();
                    ctx.translate(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2);

                    let wingSpread = Math.sin(enemy.wingAnim || 0) * 4;

                    ctx.fillStyle = '#a855f7';
                    ctx.strokeStyle = '#c084fc';
                    ctx.lineWidth = 1.5;

                    ctx.beginPath();
                    ctx.moveTo(-enemy.width / 2, -2);
                    ctx.lineTo(-enemy.width / 2 - 8, -6 + wingSpread);
                    ctx.lineTo(-enemy.width / 2 - 4, 5 - wingSpread);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(enemy.width / 2, -2);
                    ctx.lineTo(enemy.width / 2 + 8, -6 - wingSpread);
                    ctx.lineTo(enemy.width / 2 + 4, 5 + wingSpread);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = '#6b21a8';
                    ctx.strokeStyle = '#f472b6';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(0, -enemy.height / 2);
                    ctx.lineTo(enemy.width / 2, 0);
                    ctx.lineTo(0, enemy.height / 2);
                    ctx.lineTo(-enemy.width / 2, 0);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = '#ef4444';
                    ctx.shadowColor = '#ef4444';
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.arc(0, 0, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    let thrusterH = 5 + Math.random() * 5;
                    ctx.fillStyle = '#38bdf8';
                    ctx.beginPath();
                    ctx.moveTo(-3, enemy.height / 2);
                    ctx.lineTo(3, enemy.height / 2);
                    ctx.lineTo(0, enemy.height / 2 + thrusterH);
                    ctx.closePath();
                    ctx.fill();

                    ctx.restore();
                } else {
                    ctx.fillStyle = '#f97316';
                    ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
                    ctx.strokeStyle = '#fed7aa';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(enemy.x, enemy.y, enemy.width, enemy.height);

                    ctx.fillStyle = '#ef4444';
                    let eyeOffset = enemy.direction === 1 ? enemy.x + 18 : enemy.x + 4;
                    ctx.fillRect(eyeOffset, enemy.y + 8, 8, 6);
                }
            });

            // Draw Coins
            coins.forEach(coin => {
                if (!coin.collected) {
                    ctx.fillStyle = '#facc15';
                    ctx.beginPath();
                    ctx.arc(coin.x, coin.y, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#ca8a04';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    ctx.fillStyle = '#fef08a';
                    ctx.fillRect(coin.x - 2, coin.y - 4, 4, 8);
                }
            });

            // Render Level 5 Omega Sentinel Boss Entity & Arena Elements
            if (currentLevel === 5 && boss) {
                telegraphedAttacks.forEach(atk => {
                    let progress = 1 - (atk.timer / atk.maxTimer);
                    let pulse = Math.sin(Date.now() / 60) * 0.15 + 0.35;
                    ctx.save();
                    ctx.setLineDash([8, 6]);

                    atk.paths.forEach(p => {
                        ctx.strokeStyle = p.color;
                        ctx.globalAlpha = pulse;
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(p.startX, p.startY);
                        ctx.lineTo(p.endX, p.endY);
                        ctx.stroke();

                        ctx.fillStyle = p.color;
                        ctx.globalAlpha = Math.min(1, progress * 1.3);
                        ctx.beginPath();
                        ctx.arc(p.startX, p.startY, 5 + Math.sin(Date.now() / 40) * 2, 0, Math.PI * 2);
                        ctx.fill();
                    });
                    ctx.restore();
                });
                ctx.save();
                ctx.translate(boss.x, boss.y);

                let isHit = boss.hitFlashTimer > 0;

                ctx.strokeStyle = isHit ? '#ffffff' : '#a855f7';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 48 + Math.sin(boss.angle * 3) * 4, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = isHit ? '#fef08a' : '#4c1d95';
                ctx.strokeStyle = isHit ? '#ffffff' : '#e879f9';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(0, -38);
                ctx.lineTo(38, 0);
                ctx.lineTo(0, 38);
                ctx.lineTo(-38, 0);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = isHit ? '#ffffff' : '#ef4444';
                ctx.shadowColor = '#ef4444';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(0, 0, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.restore();

                bossProjectiles.forEach(p => {
                    ctx.fillStyle = p.color;
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                });

                playerMissiles.forEach(m => {
                    ctx.fillStyle = '#38bdf8';
                    ctx.shadowColor = '#38bdf8';
                    ctx.shadowBlur = 12;
                    ctx.beginPath();
                    ctx.arc(m.x, m.y, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                });

                if (bossItem) {
                    let floatOffset = Math.sin(bossItem.floatAnim) * 5;
                    let itemX = bossItem.x;
                    let itemY = bossItem.y + floatOffset;

                    ctx.fillStyle = '#facc15';
                    ctx.shadowColor = '#facc15';
                    ctx.shadowBlur = 12;
                    ctx.fillRect(itemX, itemY, bossItem.width, bossItem.height);
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(itemX, itemY, bossItem.width, bossItem.height);
                    ctx.shadowBlur = 0;

                    ctx.fillStyle = '#0284c7';
                    ctx.fillRect(itemX + 6, itemY + 6, 12, 12);
                }
            }

            // Render Level 11 Ignis Prime Boss Entity & Arena Elements
            if (currentLevel === 11 && ignisBoss) {
                // Telegraphed Attack Warnings
                telegraphedAttacks.forEach(atk => {
                    let pulse = Math.sin(Date.now() / 50) * 0.2 + 0.5;
                    ctx.save();
                    ctx.globalAlpha = pulse;

                    if (atk.type === 'flame_pillar') {
                        // Vertical flame warning pillar line
                        ctx.strokeStyle = '#ef4444';
                        ctx.lineWidth = 3;
                        ctx.setLineDash([10, 6]);
                        ctx.beginPath();
                        ctx.moveTo(atk.x, 0);
                        ctx.lineTo(atk.x, 500);
                        ctx.stroke();

                        ctx.fillStyle = '#f97316';
                        ctx.fillRect(atk.x - atk.width / 2, 420, atk.width, 20);
                    } else if (atk.paths) {
                        ctx.setLineDash([8, 6]);
                        atk.paths.forEach(p => {
                            ctx.strokeStyle = p.color;
                            ctx.lineWidth = 2;
                            ctx.beginPath();
                            ctx.moveTo(p.startX, p.startY);
                            ctx.lineTo(p.endX, p.endY);
                            ctx.stroke();
                        });
                    }
                    ctx.restore();
                });

                // Active Flame Pillars
                flamePillars.forEach(fp => {
                    let fpGrad = ctx.createLinearGradient(fp.x, 0, fp.x + fp.width, 0);
                    fpGrad.addColorStop(0, '#ff4500');
                    fpGrad.addColorStop(0.5, '#facc15');
                    fpGrad.addColorStop(1, '#ff4500');
                    ctx.fillStyle = fpGrad;
                    ctx.fillRect(fp.x, fp.y, fp.width, fp.height);

                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(fp.x + fp.width / 2 - 3, fp.y, 6, fp.height);
                });

                // Ignis Boss Visual Entity
                ctx.save();
                ctx.translate(ignisBoss.x, ignisBoss.y);

                let isHit = ignisBoss.hitFlashTimer > 0;

                // Pulsing Magma Aura
                ctx.fillStyle = isHit ? '#ffffff' : '#f9731633';
                ctx.beginPath();
                ctx.arc(0, 0, 65 + Math.sin(ignisBoss.angle * 4) * 6, 0, Math.PI * 2);
                ctx.fill();

                // Fiery Horned Crown Hull
                ctx.fillStyle = isHit ? '#fef08a' : '#991b1b';
                ctx.strokeStyle = isHit ? '#ffffff' : '#f97316';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(0, -45);
                ctx.lineTo(25, -20);
                ctx.lineTo(45, 10);
                ctx.lineTo(20, 45);
                ctx.lineTo(-20, 45);
                ctx.lineTo(-45, 10);
                ctx.lineTo(-25, -20);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Glowing Lava Core Eye
                ctx.fillStyle = isHit ? '#ffffff' : '#facc15';
                ctx.shadowColor = '#facc15';
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.arc(0, 0, 15, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.restore();

                // Ignis Boss Projectiles
                bossProjectiles.forEach(p => {
                    ctx.fillStyle = p.color;
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                });

                // Player Cryo Missiles
                playerMissiles.forEach(m => {
                    ctx.fillStyle = '#38bdf8';
                    ctx.shadowColor = '#38bdf8';
                    ctx.shadowBlur = 14;
                    ctx.beginPath();
                    ctx.arc(m.x, m.y, 7, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                });

                // Floating Frost Crystal Core Item
                if (bossItem) {
                    let floatOffset = Math.sin(bossItem.floatAnim) * 5;
                    let itemX = bossItem.x;
                    let itemY = bossItem.y + floatOffset;

                    ctx.fillStyle = '#38bdf8';
                    ctx.shadowColor = '#38bdf8';
                    ctx.shadowBlur = 14;
                    ctx.fillRect(itemX, itemY, bossItem.width, bossItem.height);
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(itemX, itemY, bossItem.width, bossItem.height);
                    ctx.shadowBlur = 0;

                    ctx.fillStyle = '#bae6fd';
                    ctx.fillRect(itemX + 6, itemY + 6, 12, 12);
                }
            }

            // Draw Goal Portal
            if (goal.x !== undefined) {
                ctx.fillStyle = '#10b981';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#10b981';
                ctx.fillRect(goal.x, goal.y, goal.width, goal.height);
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#6ee7b7';
                ctx.fillRect(goal.x + 6, goal.y + 6, goal.width - 12, goal.height - 12);
            }

            // Draw Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            });

            // Draw Floating Text
            floatingTexts.forEach(ft => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, ft.alpha);
                ctx.font = '10px "Press Start 2P", monospace';
                ctx.fillStyle = ft.color;
                ctx.textAlign = 'center';
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            });

            // Draw Player (flashes when invincible)
            if (invincibilityTimer % 4 < 2) {
                if (hasBlackHeartShield) {
                    ctx.save();
                    ctx.strokeStyle = '#c084fc';
                    ctx.lineWidth = 2.5;
                    ctx.shadowColor = '#a855f7';
                    ctx.shadowBlur = 12;
                    ctx.beginPath();
                    ctx.arc(player.x + player.width / 2, player.y + player.height / 2, 22 + Math.sin(Date.now() / 100) * 2, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }

                ctx.save();
                ctx.translate(player.x + player.width / 2, player.y + player.height);
                ctx.scale(playerScaleX, playerScaleY);

                ctx.fillStyle = player.color;
                ctx.fillRect(-player.width / 2, -player.height, player.width, player.height);
                ctx.strokeStyle = '#bae6fd';
                ctx.lineWidth = 2;
                ctx.strokeRect(-player.width / 2, -player.height, player.width, player.height);

                ctx.fillStyle = '#0f172a';
                let eyeX = player.facing === 'right' ? 3 : -9;
                ctx.fillRect(eyeX, -player.height + 8, 6, 6);

                ctx.restore();
            }

            ctx.restore();

            // Draw Boss Health Bar Overlay in Level 5
            if (currentLevel === 5 && boss) {
                ctx.save();
                let barW = 320;
                let barH = 16;
                let barX = (canvas.width - barW) / 2;
                let barY = 16;

                ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
                ctx.fillRect(barX - 10, barY - 14, barW + 20, barH + 22);
                ctx.strokeStyle = '#a855f7';
                ctx.lineWidth = 2;
                ctx.strokeRect(barX - 10, barY - 14, barW + 20, barH + 22);

                ctx.font = '9px "Press Start 2P", monospace';
                ctx.fillStyle = '#e879f9';
                ctx.textAlign = 'center';
                ctx.fillText('OMEGA SENTINEL [BOSS]', canvas.width / 2, barY - 2);

                let hpPct = Math.max(0, boss.hp / boss.maxHp);
                ctx.fillStyle = hpPct > 0.4 ? '#ef4444' : '#dc2626';
                ctx.fillRect(barX, barY + 2, barW * hpPct, barH - 4);
                ctx.strokeStyle = '#fef08a';
                ctx.lineWidth = 1;
                ctx.strokeRect(barX, barY + 2, barW, barH - 4);

                ctx.restore();
            }

            // Draw Boss Health Bar Overlay in Level 11
            if (currentLevel === 11 && ignisBoss) {
                ctx.save();
                let barW = 320;
                let barH = 16;
                let barX = (canvas.width - barW) / 2;
                let barY = 16;

                ctx.fillStyle = 'rgba(20, 5, 5, 0.9)';
                ctx.fillRect(barX - 10, barY - 14, barW + 20, barH + 22);
                ctx.strokeStyle = '#f97316';
                ctx.lineWidth = 2;
                ctx.strokeRect(barX - 10, barY - 14, barW + 20, barH + 22);

                ctx.font = '9px "Press Start 2P", monospace';
                ctx.fillStyle = '#facc15';
                ctx.textAlign = 'center';
                ctx.fillText('IGNIS PRIME [LAVA TITAN]', canvas.width / 2, barY - 2);

                let hpPct = Math.max(0, ignisBoss.hp / ignisBoss.maxHp);
                ctx.fillStyle = hpPct > 0.4 ? '#f97316' : '#ef4444';
                ctx.fillRect(barX, barY + 2, barW * hpPct, barH - 4);
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 1;
                ctx.strokeRect(barX, barY + 2, barW, barH - 4);

                ctx.restore();
            }

            // Draw Level Announcement Banner
            if (levelBanner.timer > 0) {
                levelBanner.timer--;
                let alpha = Math.min(1, levelBanner.timer / 25);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.font = '11px "Press Start 2P", monospace';
                ctx.textAlign = 'center';
                let textW = ctx.measureText(levelBanner.text).width + 36;
                let bannerH = 34;
                let bannerX = (canvas.width - textW) / 2;
                let bannerY = 18;

                ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
                ctx.fillRect(bannerX, bannerY, textW, bannerH);
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 2;
                ctx.strokeRect(bannerX, bannerY, textW, bannerH);

                ctx.fillStyle = '#ec4899';
                ctx.fillRect(bannerX - 2, bannerY - 2, 6, 6);
                ctx.fillRect(bannerX + textW - 4, bannerY - 2, 6, 6);
                ctx.fillRect(bannerX - 2, bannerY + bannerH - 4, 6, 6);
                ctx.fillRect(bannerX + textW - 4, bannerY + bannerH - 4, 6, 6);

                ctx.fillStyle = '#facc15';
                ctx.fillText(levelBanner.text, canvas.width / 2, bannerY + 22);
                ctx.restore();
            }
        }

        // Main Loop
        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        // Start loop on load
        window.onload = function () {
            loadLevel(1);
            gameLoop();
        };
    </script>
</body>

</html>
